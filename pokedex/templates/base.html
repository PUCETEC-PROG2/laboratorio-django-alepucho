{% load static %}
<html>
  <head>
    <title>Pokedex</title>
    <link href="{% static 'bootstrap.min.css' %}" rel="stylesheet" />
    <link href="{% static 'custom.css' %}" rel="stylesheet" />
    <link href="{% static 'bootstrap.theme.css' %}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
      <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-2">
        <div class="container-fluid">
          <a class="navbar-brand d-flex align-items-center" href="{% url 'pokedex:index' %}"><img src="{% static 'pokedex_logo.png' %}" alt="Pokédex" style="height:44px; width:auto; margin-right:.6rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,.15));" /></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
              <li class="nav-item me-2 d-none d-lg-block">
                <a class="nav-link" href="{% url 'pokedex:index' %}">Pokédex</a>
              </li>
              <li class="nav-item me-2">
                <a class="nav-link" aria-current="page" href="{% url 'pokedex:trainers' %}">Entrenadores</a>
              </li>
              {% if not user.is_authenticated %}
                <li class="nav-item">
                  <a class="nav-link btn btn-outline-light btn-sm px-3" href="{% url 'pokedex:login' %}">Iniciar Sesión</a>
                </li>
              {% else %}
                <li class="nav-item">
                  <form method="post" action="{% url 'logout' %}" style="display:inline; margin:0;">
                    {% csrf_token %}
                    <button type="submit" class="nav-link btn btn-link">Cerrar Sesión</button>
                  </form>
                </li>
              {% endif %}
            </ul>
          </div>
        </div>
      </nav>
      {% block content %}

      {% endblock %}
    </div>
  </body>
</html>
