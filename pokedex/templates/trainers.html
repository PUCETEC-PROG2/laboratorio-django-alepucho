{% extends 'base.html' %}
{% block content %}
  <h3>Entrenadores disponibles:</h3>
  <div class="row">
    {% for trainer in trainers %}
      <div class="col-sm-12 col-md-6 col-lg-4 mb-4">
        <div class="card h-100 card-custom shadow-sm border-0">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ trainer.name|capfirst }}</h5>
            <!-- Botones de acción -->
            <a href="{% url 'pokedex:trainer' trainer.id %}" class="btn btn-custom-primary mt-3"><i class="fa-regular fa-eye"></i></a>
            <a href="{% url 'pokedex:edit_trainer' trainer.id %}" class="btn btn-custom-primary mt-3"><i class="fa-solid fa-pen-to-square"></i></a>
            <a href="{% url 'pokedex:delete_trainer' trainer.id %}" class="btn btn-custom-secondary mt-3" onclick="return confirm('¿Seguro que quieres eliminar este entrenador?');"><i class="fa-solid fa-trash"></i></a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
