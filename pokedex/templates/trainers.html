{% extends "base.html" %}
{% block content %}
<h3>Entrenadores disponibles:</h3>
<div class="row">
      {% for trainer in trainers %}
        <div class="col-sm-12 col-md-6 col-lg-4 mb-4"> 
          <div class="card h-100 card-custom shadow-sm border-0">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title"><a href="{% url 'pokedex:trainer' trainer.id %}">{{ trainer.name|capfirst }}</a></h5>
            </div>
          </div>
        </div>
      {% endfor %}
  </div>
{% endblock %}
